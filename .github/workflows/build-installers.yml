name: Build installers

# Builds the Ubuntu .deb. Run it by hand from the Actions tab, or push a tag
# like v0.2.0 to also attach it to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-deb:
    # Oldest supported Ubuntu: the bundled binaries need the build machine's
    # glibc or newer, so this .deb runs on 22.04 and later.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxcb-cursor0 libxkbcommon-x11-0 libegl1

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build installer
        run: bash packaging/linux/build_deb.sh

      # Runs the frozen app in self-check mode: QtWebEngine must render a page
      # and ffmpeg/ffprobe must be found.
      - name: Smoke-test the bundled app
        env:
          YTS_SMOKE_TEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: timeout 120 build/pyinstaller/dist/ytmusic-sync/ytmusic-sync

      - uses: actions/upload-artifact@v4
        with:
          name: installer-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach installers to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
